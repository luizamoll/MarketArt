<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalização da compra | MarketArt</title>
</head>

<body>
    <header>
        <h1>Finalização da compra</h1>
        <p>Revise os dados do pedido antes de confirmar.</p>
    </header>

    <main>
        <section>
            <h2>Resumo do pedido</h2>

            <article>
                <h3>Obra selecionada</h3>
                <p>Nome da obra: Exemplo de obra</p>
                <p>Artista: Nome do artista</p>
                <p>Quantidade: 1</p>
                <p>Valor: R$ 0,00</p>
            </article>
        </section>

        <section>
            <h2>Dados do comprador</h2>

            <form>
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <br>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>
            </form>
        </section>

        <section>
            <h2>Forma de pagamento</h2>

            <form>
                <input type="radio" id="pix" name="pagamento" value="pix">
                <label for="pix">Pix</label>

                <input type="radio" id="cartao" name="pagamento" value="cartao">
                <label for="cartao">Cartão</label>

                <input type="radio" id="boleto" name="pagamento" value="boleto">
                <label for="boleto">Boleto</label>
            </form>
        </section>

        <section>
            <h2>Confirmação</h2>
            <p>Total da compra: R$ 0,00</p>
            <button type="button">Confirmar compra</button>
        </section>
    </main>

    <footer>
        <p>MarketArt</p>
    </footer>
</body>
</html>
