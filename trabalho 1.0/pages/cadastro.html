<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | MarketArt</title>
</head>
<body>
    <header>
        <h1>Cadastro</h1>
        <p>Crie sua conta para comprar ou vender obras no MarketArt.</p>
    </header>

    <main>
        <section>
            <h2>Dados pessoais</h2>
            <form>
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <br>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>

                <br>

                <label for="perfil">Perfil:</label>
                <select id="perfil" name="perfil" required>
                    <option value="">Selecione</option>
                    <option value="comprador">Comprador</option>
                    <option value="artista">Artista / vendedor</option>
                </select>

                <br>

                <button type="submit">Criar conta</button>
            </form>
        </section>

        <section>
            <h2>Venda de obras</h2>
            <p>Artistas cadastrados poderão publicar informações sobre suas obras para exposição e venda.</p>

            <form>
                <label for="obra">Nome da obra:</label>
                <input type="text" id="obra" name="obra">

                <br>

                <label for="categoria">Categoria:</label>
                <input type="text" id="categoria" name="categoria">

                <br>

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" name="descricao" rows="5"></textarea>

                <br>

                <label for="preco">Preço:</label>
                <input type="number" id="preco" name="preco" min="0" step="0.01">

                <br>

                <button type="submit">Cadastrar obra</button>
            </form>
        </section>
    </main>

    <footer>
        <p>MarketArt</p>
    </footer>
</body>
</html>
