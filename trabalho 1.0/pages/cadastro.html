<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | MarketArt</title>
    <link rel="stylesheet" href="../css/luiza.css">
</head>
<body>
    <header>
        <h1>MarketArt</h1>
        <nav>
            <a href="checkout.html">Home</a>
            <a href="categorias.html">Categorias</a>
            <a href="pesquisa.html">Pesquisa</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="notificacoes.html">Notificações</a>
            <a href="configuracoes.html">Configurações</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Crie sua conta</h2>
            <p>Cadastre-se para comprar obras ou publicar trabalhos artísticos no MarketArt.</p>

            <form>
                <p>
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </p>

                <p>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </p>

                <p>
                    <label for="perfil">Perfil:</label>
                    <select id="perfil" name="perfil" required>
                        <option value="">Selecione</option>
                        <option value="comprador">Comprador</option>
                        <option value="artista">Artista / vendedor</option>
                    </select>
                </p>

                <p>
                    <input type="checkbox" id="termos" name="termos" required>
                    <label for="termos">Aceito os termos de uso da plataforma.</label>
                </p>

                <button type="submit">Criar conta</button>
            </form>
        </section>

        <section>
            <h2>Venda sua arte</h2>
            <p>Artistas cadastrados podem informar os dados da obra que desejam expor e vender.</p>

            <form>
                <p>
                    <label for="obra">Nome da obra:</label>
                    <input type="text" id="obra" name="obra" required>
                </p>

                <p>
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Selecione</option>
                        <option value="ilustracao">Ilustração</option>
                        <option value="pintura">Pintura</option>
                        <option value="escultura">Escultura</option>
                        <option value="arte-digital">Arte digital</option>
                    </select>
                </p>

                <p>
                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" name="descricao" rows="5" required></textarea>
                </p>

                <p>
                    <label for="preco">Preço:</label>
                    <input type="number" id="preco" name="preco" min="0" step="0.01" required>
                </p>

                <p>
                    <label for="imagem">Imagem da obra:</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*">
                </p>

                <button type="submit">Cadastrar obra</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MarketArt.</p>
    </footer>
</body>
</html>
