<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações | MarketArt</title>
</head>
<body>
    <header>
        <h1>Configurações</h1>
        <p>Atualize informações e preferências da sua conta.</p>
    </header>

    <main>
        <section>
            <h2>Dados da conta</h2>
            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">

                <br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">

                <br>

                <label for="senha">Nova senha:</label>
                <input type="password" id="senha" name="senha">

                <br>

                <button type="submit">Salvar alterações</button>
            </form>
        </section>

        <section>
            <h2>Preferências</h2>
            <form>
                <input type="checkbox" id="novidades" name="novidades">
                <label for="novidades">Receber novidades e lançamentos</label>

                <br>

                <input type="checkbox" id="pedidos" name="pedidos">
                <label for="pedidos">Receber atualizações sobre pedidos</label>
            </form>
        </section>
    </main>

    <footer>
        <p>MarketArt</p>
    </footer>
</body>
</html>
